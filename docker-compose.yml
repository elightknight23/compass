# Local Postgres for Compass.
#   docker compose up -d
#   python scripts/seed_db.py
#   RECORD_BACKEND=postgres uvicorn app.main:app --reload
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports:
      - "5433:5432"
    volumes:
      - compass-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  compass-pg:
