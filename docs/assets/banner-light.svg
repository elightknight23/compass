<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Compass: a campus service desk that knows what it isn't allowed to do">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#253238" fill-opacity="0.07"/>
    </pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3c2d14" flood-opacity="0.18"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#f4efe5"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <!-- a compass rose, very faint, behind everything -->
    <g transform="translate(560 470)" stroke="#2d6757" fill="none" stroke-opacity="0.07">
      <circle r="330" stroke-width="2"/><circle r="250" stroke-width="1.2"/><circle r="170" stroke-width="1"/>
      <path d="M0 -330 L0 330 M-330 0 L330 0 M-233 -233 L233 233 M-233 233 L233 -233" stroke-width="1"/>
    </g>
    <rect x="0" y="0" width="8" height="440" fill="#2d6757"/>
  </g>

  <!-- left: the name and the claim -->
  <text x="76" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#2d6757">AN AGENTIC CAMPUS SERVICE DESK</text>
  <g transform="translate(74 118) scale(2.25)" color="#2d6757">
    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.45"/>
    <path d="M16 4.5l2.6 11.5L16 27.5l-2.6-11.5z" fill="currentColor"/>
    <path d="M4.5 16l11.5-2.2L27.5 16 16 18.2z" fill="currentColor" opacity="0.4"/>
    <circle cx="16" cy="16" r="1.6" fill="#f4efe5"/>
  </g>
  <text x="166" y="178" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="84" font-weight="600" letter-spacing="-1.5" fill="#253238">Compass</text>
  <text x="78" y="238" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="29" font-style="italic" fill="#4b5559">A campus service desk that knows</text>
  <text x="78" y="274" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="29" font-style="italic" fill="#4b5559">what it isn’t allowed to do.</text>

  <rect x="76" y="320" width="268" height="40" rx="20" fill="none" stroke="#d9d0bf" stroke-width="1.5"/>
  <text x="210" y="345" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" fill="#253238">The model decides what was asked.</text>
  <text x="362" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="18" fill="#7a7c76">→</text>
  <rect x="390" y="320" width="252" height="40" rx="20" fill="#2d6757"/>
  <text x="516" y="345" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f8f4ec">Python decides what happens.</text>

  <!-- right: one sentence, three accounts -->
  <g filter="url(#lift)">
    <rect x="768" y="60" width="444" height="324" rx="18" fill="#fbf8f2" stroke="#d9d0bf"/>
  </g>
  <text x="792" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#7a7c76">ONE SENTENCE · THREE ACCOUNTS</text>
  <rect x="972" y="114" width="214" height="38" rx="14" fill="#ece5d7"/>
  <text x="1079" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" fill="#253238">Approve Ravi’s OD request</text>
  <line x1="792" y1="176" x2="1188" y2="176" stroke="#d9d0bf"/>
  <circle cx="806" cy="208" r="17" fill="#ece5d7" stroke="#d9d0bf"/><text x="806" y="212.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4b5559">RK</text><text x="834" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="650" fill="#253238">Ravi</text><text x="834" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7a7c76">student</text><rect x="960" y="193" width="226" height="26" rx="13" fill="#f1dfd8"/><text x="1073.0" y="211" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9a412d">✕ refused · holds no capability</text><circle cx="806" cy="256" r="17" fill="#ece5d7" stroke="#d9d0bf"/><text x="806" y="260.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4b5559">MK</text><text x="834" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="650" fill="#253238">Meena</text><text x="834" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7a7c76">hostel warden</text><rect x="974" y="241" width="212" height="26" rx="13" fill="#f1dfd8"/><text x="1080.0" y="259" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#9a412d">✕ refused · outside her remit</text><circle cx="806" cy="304" r="17" fill="#ece5d7" stroke="#d9d0bf"/><text x="806" y="308.5" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#4b5559">LN</text><text x="834" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="650" fill="#253238">Dr. Lakshmi</text><text x="834" y="319" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7a7c76">faculty advisor</text><rect x="994" y="289" width="192" height="26" rx="13" fill="#dfe8d6"/><text x="1090.0" y="307" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3e6533">✓ approved · logged to her</text>
  <line x1="792" y1="342" x2="1188" y2="342" stroke="#d9d0bf"/>
  <text x="792" y="366" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#7a7c76">decided by <tspan fill="#2d6757">if</tspan> auth.may_action(user, "od_request")</text>
</svg>
